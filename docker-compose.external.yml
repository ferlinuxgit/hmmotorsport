services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      APP_NAME: ${APP_NAME:-Universal Boilerplate}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-Next.js production boilerplate}
      APP_URL: ${APP_URL}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BUILD_SHA: ${BUILD_SHA}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${APP_URL}}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-database}
      JOB_RUNNER_SECRET: ${JOB_RUNNER_SECRET}
      JOB_BATCH_SIZE: ${JOB_BATCH_SIZE:-10}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_URL: ${SMTP_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_MAX_FILE_BYTES: ${STORAGE_MAX_FILE_BYTES:-10485760}
      STORAGE_ALLOWED_MIME_TYPES: ${STORAGE_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,text/csv}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      DATABASE_MODE: external
      DATABASE_URL: ${DATABASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-180}
      PAYMENT_EVENT_RETENTION_DAYS: ${PAYMENT_EVENT_RETENTION_DAYS:-365}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-7}
      DRAFT_ORDER_RETENTION_DAYS: ${DRAFT_ORDER_RETENTION_DAYS:-7}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
